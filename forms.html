<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Forms</title></head><body>
<!-- Netlify form detection only. The live form is injected by /assets/site.js with the same name and fields. -->
<form name="insider-plays" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
<input type="hidden" name="form-name" value="insider-plays">
<input name="bot-field">
<input name="first_name">
<input name="email" type="email">
<select name="segment"><option>Freight brokerage</option><option>Factoring company</option><option>Trucking insurance agency</option><option>Other</option></select>
<input name="page">
<input name="first_touch">
</form>
</body></html>
